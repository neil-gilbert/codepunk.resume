name: CI - Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore lucidRESUME.sln

      - name: Build desktop solution
        run: dotnet build lucidRESUME.sln -c Release --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format lucidRESUME.sln --verify-no-changes --no-restore --severity warn

      - name: Test
        run: dotnet test lucidRESUME.sln -c Release --no-build --verbosity normal

      - name: Audit dependencies
        run: dotnet list lucidRESUME.sln package --vulnerable --include-transitive

  web-platform:
    name: Web platform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/lucidRESUME.Platform.Tests/lucidRESUME.Platform.Tests.csproj

      - name: Build
        run: dotnet build tests/lucidRESUME.Platform.Tests/lucidRESUME.Platform.Tests.csproj -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test tests/lucidRESUME.Platform.Tests/lucidRESUME.Platform.Tests.csproj -c Release --no-build --verbosity normal

  chrome-extension:
    name: Chrome extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/lucidresume-chrome/package-lock.json

      - name: Install and audit
        working-directory: extensions/lucidresume-chrome
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Check, test, and build
        working-directory: extensions/lucidresume-chrome
        run: |
          npm run check
          npm test
          npm run build
